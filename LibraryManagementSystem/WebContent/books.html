<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books - Library Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="navbar">
        <div class="nav-container">
            <h2>Library Management System</h2>
            <div class="nav-menu">
                <a href="dashboard.html">Dashboard</a>
                <a href="books.html" class="active">Books</a>
                <a href="mybooks.html">My Books</a>
                <a href="admin.html">Admin</a>
                <span class="user-info" id="userDisplay">Welcome, User!</span>
                <a href="#" class="btn-logout" onclick="confirmLogout(); return false;">Logout</a>
            </div>
        </div>
    </div>

    <div class="books-container">
        <div class="books-header">
            <h1>Library Books</h1>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search books by title, author or ISBN..." onkeyup="filterBooks()">
            </div>
        </div>

        <div class="books-table-container">
            <table class="books-table" id="booksTable">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Year</th>
                        <th>ISBN</th>
                        <th>Category</th>
                        <th>Available</th>
                        <th>Total</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="booksTableBody">
                    <!-- Books will be loaded dynamically -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="js/script.js"></script>
    <script>
        // Check user role and hide admin link if not admin
        window.addEventListener('load', function() {
            const loggedInUser = JSON.parse(localStorage.getItem('loggedInUser'));
            if (!loggedInUser) {
                alert('Please login first');
                window.location.href = 'login.html';
                return;
            }
            
            // Hide admin link for non-admin users
            const adminLink = document.querySelector('a[href="admin.html"]');
            if (loggedInUser.role !== 'admin') {
                if (adminLink) adminLink.style.display = 'none';
            }

            document.getElementById('userDisplay').textContent = 'Welcome, ' + loggedInUser.fullName + '!';

            // Load and display books
            displayBooks();
        });

        // Display all books
        function displayBooks() {
            const booksTableBody = document.getElementById('booksTableBody');
            const books = getStoredBooks();
            
            if (books.length === 0) {
                booksTableBody.innerHTML = '<tr><td colspan="8" style="text-align: center;">No books available</td></tr>';
                return;
            }

            booksTableBody.innerHTML = '';
            books.forEach((book) => {
                const row = document.createElement('tr');
                const isAvailable = book.availableCopies > 0;
                row.innerHTML = `
                    <td>${book.title}</td>
                    <td>${book.author}</td>
                    <td>${book.year || 'N/A'}</td>
                    <td>${book.isbn || 'N/A'}</td>
                    <td>${book.category}</td>
                    <td>${book.availableCopies}</td>
                    <td>${book.copies}</td>
                    <td>${isAvailable
                        ? `<button class="btn btn-small btn-success" onclick="issueBookLocally(${book.id}, '${book.title.replace(/'/g, "\\'")}')">Issue</button>`
                        : '<button class="btn btn-small btn-disabled" disabled>Not Available</button>'}</td>
                `;
                booksTableBody.appendChild(row);
            });
        }
    </script>
</body>
</html>
