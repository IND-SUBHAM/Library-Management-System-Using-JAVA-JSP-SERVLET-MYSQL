<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Library Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="navbar">
        <div class="nav-container">
            <h2>Library Management System</h2>
            <div class="nav-menu">
                <a href="dashboard.html">Dashboard</a>
                <a href="books.html">Books</a>
                <a href="profile.html" class="active">Profile</a>
                <span class="user-info" id="userDisplay">Welcome, User!</span>
                <a href="#" class="btn-logout" onclick="confirmLogout(); return false;">Logout</a>
            </div>
        </div>
    </div>

    <div class="profile-container">
        <div class="profile-header">
            <h1>My Profile</h1>
        </div>

        <div class="profile-card">
            <div class="profile-info">
                <div class="info-group">
                    <label>Full Name:</label>
                    <span id="profileFullName">Biswagat M Bairagi</span>
                </div>

                <div class="info-group">
                    <label>Username:</label>
                    <span id="profileUsername">Biswagat</span>
                </div>

                <div class="info-group">
                    <label>Email:</label>
                    <span id="profileEmail">djsubham774@gmail.com</span>
                </div>

                <div class="info-group">
                    <label>Role:</label>
                    <span id="profileRole">ADMIN</span>
                </div>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
    <script>
        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('loggedInUser');
                localStorage.removeItem('loggedIn');
                window.location.href = 'login.html';
            }
        }
        window.addEventListener('load', function() {
            const loggedInUser = JSON.parse(localStorage.getItem('loggedInUser'));
            if (!loggedInUser) {
                alert('Please login first');
                window.location.href = 'login.html';
                return;
            }
            document.getElementById('userDisplay').textContent = 'Welcome, ' + loggedInUser.fullName + '!';
            document.getElementById('profileFullName').textContent = loggedInUser.fullName;
            document.getElementById('profileUsername').textContent = loggedInUser.username;
            document.getElementById('profileEmail').textContent = loggedInUser.email;
            document.getElementById('profileRole').textContent = loggedInUser.role.toUpperCase();
        });
    </script>
</body>
</html>
